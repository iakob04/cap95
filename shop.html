    <main id="main"></main>


    <script>
        const caps = [
            { src: 'ff_camo.png',        label: 'camo',        shopifyId: '15857186799950' },
            { src: 'ff_duskypink.png',   label: 'duskypink',   shopifyId: '15857169400142' },
            { src: 'ff_cornflower.png',  label: 'cornflower',  shopifyId: '15857175527758' },
            { src: 'ff_sagegreen.png',   label: 'sagegreen',   shopifyId: '15857172480334' },
            { src: 'ff_denim.png',       label: 'denim',       shopifyId: '15857170252110' },
            { src: 'ff_red.png',         label: 'red',         shopifyId: '15857181458766' },
        ];

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        const main = document.getElementById('main');
        const items = [];
        const itemByShopifyId = {};

        shuffle(caps).forEach(cap => {
            const section = document.createElement('section');
            section.className = 'cap-screen';

            const item = document.createElement('div');
            item.className = 'cap-item';
            item.innerHTML = `
                <div class="cap-img-wrap">
                    <img src="${cap.src}" alt="${cap.label}">
                </div>
                <div class="cap-label-wrap"><div class="cap-label">${cap.label}</div></div>
                <div class="cap-shipping">Versand Anfang Juli 2026</div>
            `;

            if (cap.shopifyId) itemByShopifyId[cap.shopifyId] = item;

            item.addEventListener('click', () => {
                if (!cap.shopifyId) return;
                if (item.classList.contains('sold-out')) return;
                const cached = window._shopifyComponents && window._shopifyComponents[cap.label];
                if (cached) { cached.openModal(); return; }
                if (!window._shopifyUI) return;
                const node = document.createElement('div');
                document.getElementById('shopify-mounts').appendChild(node);
                window._shopifyUI.createComponentOriginal('product', {
                    id: cap.shopifyId,
                    node: node,
                    moneyFormat: '%7B%7Bamount_with_comma_separator%7D%7D%20%E2%82%AC',
                    options: window._shopifyOptions
                }).then(function(component) {
                    window._shopifyComponents[cap.label] = component;
                    component.openModal();
                });
            });

            section.appendChild(item);
            main.appendChild(section);
            items.push({ item, section });
        });

        // Ausverkauft-Overlay: Verfügbarkeit via Shopify Storefront API prüfen
        (function() {
            const ids = caps.filter(c => c.shopifyId).map(c => `gid://shopify/Product/${c.shopifyId}`);
            const query = `{nodes(ids:${JSON.stringify(ids)}){... on Product{id availableForSale}}}`;
            fetch('https://92k77k-mp.myshopify.com/api/2024-01/graphql.json', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Shopify-Storefront-Access-Token': 'e7fc2e35e4e43c083eaa69a0f933b28f'
                },
                body: JSON.stringify({ query })
            }).then(r => r.json()).then(data => {
                (data.data.nodes || []).forEach(node => {
                    if (!node || node.availableForSale) return;
                    const pid = node.id.split('/').pop();
                    const el = itemByShopifyId[pid];
                    if (!el) return;
                    el.classList.add('sold-out');
                    const badge = document.createElement('div');
                    badge.textContent = 'ausverkauft';
                    badge.className = 'ausverkauft-badge';
                    el.querySelector('.cap-label-wrap').appendChild(badge);
                });
            }).catch(() => {});
        })();


        // Scroll-zoom: cap scales up as it approaches viewport center, shrinks as it leaves
        function updateScales() {
            const vh     = window.innerHeight;
            const middle = window.scrollY + vh / 2;

            items.forEach(({ item, section }) => {
                const secCenter = section.offsetTop + section.offsetHeight / 2;
                const dist      = Math.abs(middle - secCenter);
                const maxDist   = vh * 0.8;
                const t         = Math.max(0, 1 - dist / maxDist); // 0 → 1
                const scale     = 0.45 + 0.55 * t;                 // 0.45 → 1.0
                item.style.transform = `scale(${scale})`;
            });
        }

        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(() => { updateScales(); ticking = false; });
                ticking = true;
            }
        }, { passive: true });

        updateScales();
    </script>

    <div id="shopify-mounts" style="position:absolute;left:-9999px;top:0"></div>
    <script>
    // Inject centering CSS into Shopify modal iframes
    (function() {
        const ts = 'text-shadow:-0.35px 0.35px rgba(255,20,20,0.5),0px -0.35px rgba(20,255,20,0.5),0.35px 0.35px rgba(20,20,255,0.5)!important';
        const css = `[class*="price"],[class*="Price"]{text-align:center!important;justify-content:center!important;${ts}}[class*="description"] p{margin-bottom:3.12px!important;${ts}}.shopify-buy__product__title{${ts}}.shopify-buy__btn{${ts};text-transform:none!important}.shopify-buy__quantity{border-top-right-radius:0!important;border-bottom-right-radius:0!important;margin:0!important}.shopify-buy__modal{background:transparent!important}.shopify-buy__btn-and-quantity{gap:0!important;display:flex!important;justify-content:center!important;align-items:stretch!important}.shopify-buy__btn.shopify-buy__beside-quantity{border-top-left-radius:0!important;border-bottom-left-radius:0!important;margin:0!important}.shopify-buy__quantity-container{margin:0!important;padding:0!important}`;
        const cartCss = `[class*="price"],[class*="Price"]{text-align:center!important;justify-content:center!important}`;
        function injectIntoFrame(iframe) {
            try {
                const doc = iframe.contentDocument;
                if (!doc || !doc.head) return;
                const s = doc.createElement('style');
                const isCart = !!iframe.closest('.shopify-buy-frame--cart');
                s.textContent = isCart ? cartCss : css;
                doc.head.appendChild(s);
            } catch(e) {}
        }
        // Make outer overlay transparent
        const outerStyle = document.createElement('style');
        outerStyle.textContent = '.shopify-buy-modal-wrapper{background:url("ff_bg_mirror.jpg") center top / cover fixed!important}.shopify-buy-frame--modal{background:transparent!important}';
        document.head.appendChild(outerStyle);

        function injectAll() {
            [...document.querySelectorAll('iframe')].forEach(f => {
                f.style.background = 'transparent';
                injectIntoFrame(f);
            });
        }

        const obs = new MutationObserver(mutations => {
            mutations.forEach(m => m.addedNodes.forEach(node => {
                if (node.tagName === 'IFRAME') {
                    node.style.background = 'transparent';
                    node.addEventListener('load', () => injectIntoFrame(node));
                    injectIntoFrame(node);
                }
            }));
        });
        obs.observe(document.body, { childList: true, subtree: true });

        function applyModalBg() {
            const wrapper = document.querySelector('.shopify-buy-modal-wrapper');
            if (wrapper) {
                wrapper.style.setProperty('background-image', "url('ff_bg_mirror.jpg')", 'important');
                wrapper.style.setProperty('background-size', '100% auto', 'important');
                wrapper.style.setProperty('background-position', 'center top', 'important');
                wrapper.style.setProperty('background-attachment', 'fixed', 'important');
            }
        }

        // Also inject on every cap click with delay (modal loads async)
        document.addEventListener('click', function(e) {
            if (e.target.closest('.cap-item')) {
                setTimeout(injectAll, 500);
                setTimeout(injectAll, 1500);
                setTimeout(applyModalBg, 200);
                setTimeout(applyModalBg, 800);
            }
        });
    })();
    </script>
